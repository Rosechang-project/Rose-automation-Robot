name: Send LINE Reminders

on:
  schedule:
    - cron: "5 0,13 * * *"
  workflow_dispatch:

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder job
        run: |
          curl --fail --silent --show-error \
            --location \
            --request POST \
            --max-time 180 \
            --retry 2 \
            --retry-delay 15 \
            --header "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            https://rose-automation-robot.onrender.com/cron/reminder
